<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="t2 d2">
  <title id="t2">Schematic: multiphysics transport modeling for energy and fire safety</title>
  <desc id="d2">Left: a metal hydride hydrogen storage reactor with cooling channels and reaction fronts. Right: a gypsum board cross section under heat flux with dehydration fronts moving inward.</desc>
  <defs>
    <linearGradient id="hot" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#c94a2b"/><stop offset="0.5" stop-color="#e9a23b"/><stop offset="1" stop-color="#1e7a8c"/></linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#c94a2b"/></marker>
  </defs>
  <rect width="640" height="360" fill="#f6f4ee"/>
  <!-- reactor -->
  <g>
    <rect x="50" y="70" width="220" height="150" rx="16" fill="#e6ebef" stroke="#0b1f33" stroke-width="2"/>
    <g fill="#1e7a8c" opacity="0.9">
      <rect x="70" y="95" width="180" height="10" rx="5"/>
      <rect x="70" y="140" width="180" height="10" rx="5"/>
      <rect x="70" y="185" width="180" height="10" rx="5"/>
    </g>
    <g fill="none" stroke="#c94a2b" stroke-width="2" stroke-dasharray="5 4">
      <ellipse cx="160" cy="122" rx="60" ry="14"/>
      <ellipse cx="160" cy="167" rx="60" ry="14"/>
    </g>
    <path d="M20 145h30" stroke="#0b1f33" stroke-width="2" marker-end="url(#arr2)"/>
    <text x="8" y="130" font-family="Inter, Arial, sans-serif" font-size="11" fill="#5b6b7a">H2 in</text>
  </g>
  <text x="160" y="245" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#0b1f33">Metal hydride reactor</text>
  <text x="160" y="262" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5b6b7a">coupled heat and mass transfer, reaction kinetics</text>
  <text x="160" y="278" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5b6b7a">cooling channel layout, reactor geometry</text>
  <!-- gypsum -->
  <g>
    <rect x="380" y="70" width="210" height="150" fill="#f1ede3" stroke="#0b1f33" stroke-width="2"/>
    <rect x="380" y="70" width="210" height="150" fill="url(#hot)" opacity="0.55"/>
    <g fill="none" stroke="#0b1f33" stroke-width="1.6" stroke-dasharray="6 4">
      <path d="M380 110c40 8 80 8 105 0s65-8 105 0"/>
      <path d="M380 150c40 8 80 8 105 0s65-8 105 0"/>
    </g>
    <g stroke="#c94a2b" stroke-width="2.4" marker-end="url(#arr2)">
      <path d="M410 40v22"/><path d="M485 40v22"/><path d="M560 40v22"/>
    </g>
    <text x="485" y="32" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#c94a2b">incident heat flux</text>
  </g>
  <text x="485" y="245" font-family="Inter, Arial, sans-serif" font-size="13" text-anchor="middle" fill="#0b1f33">Gypsum board under fire exposure</text>
  <text x="485" y="262" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5b6b7a">3D dehydration and calcination fronts</text>
  <text x="485" y="278" font-family="Inter, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#5b6b7a">validated against cone-calorimeter data</text>
  <text x="320" y="325" font-family="Inter, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#5b6b7a">Finite-volume multiphysics models built from first principles and validated against experiments</text>
</svg>
