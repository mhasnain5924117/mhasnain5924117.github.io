mentoring:
  - >-
    **Research mentor, FireGY Laboratory, Georgia Southern (2022–2024).** Trained undergraduate and
    graduate researchers in finite-volume modeling, running a hands-on workshop series with the open-source
    [FVTool](https://github.com/simulkade/FVTool) toolbox to solve diffusion and diffusion-advection
    problems before moving to in-house solvers. Mentees co-authored four posters at the 2024 Student
    Research Symposium and two conference abstracts.
  - >-
    **Student mentor, Mentor Collective, Georgia Southern (2023–2024).** Guided new university students
    through academic planning, research opportunities, and campus engagement.

