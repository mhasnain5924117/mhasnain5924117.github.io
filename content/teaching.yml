# The Teaching and Mentoring section.
# Formatting you can use in any text: *italic*, **bold**, [link text](https://address)

intro: >-
  I teach the way I was taught best: by meeting students where they are, connecting every derivation to
  a physical consequence they can picture, and building a classroom in which asking a basic question is
  normal. My goal is for students to leave a course able to set up a problem from first principles,
  choose a numerical method deliberately, and check whether the answer makes physical sense.

training:
  - >-
    **Academy for Future Faculty Fellow**, Texas A&M Center for Teaching Excellence, 2026–2027 (in
    progress). Year-long program on evidence-based teaching, course design, and a teaching portfolio with
    philosophy statement, sample syllabus, and course blueprint.
  - >-
    **Teaching Assistant Institute**, Texas A&M Center for Teaching Excellence, August 2024. Classroom
    management, inclusive instruction, and academic-integrity protocols.
  - Center for the Integration of Research, Teaching and Learning (CIRTL) Network programming.

