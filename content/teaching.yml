    role: Graduate Teaching Assistant for 90+ undergraduates; delivered lectures in the professor's absence, held office hours, and managed grading for all assignments and examinations
    where: Texas A&M University, Fall 2024
  - course: MENG 7136 Mechatronics I Laboratory
    role: Laboratory Instructor; supervised graduate lab sessions on sensors, actuators, instrumentation, and data acquisition
    where: Georgia Southern University, 2023–2024
  - course: MENG 4210 Energy Science Laboratory
    role: Laboratory Instructor; experiments reinforcing fluid mechanics, thermodynamics, and heat transfer; data analysis and report writing
    where: Georgia Southern University, 2023–2024
  - course: ENGR 2139 Numerical Methods in Engineering
    role: Graduate Teaching Assistant; linear systems, regression, error analysis, and MATLAB implementations
    where: Georgia Southern University, 2023–2024
  - course: ENGR 2112 Solid Modeling and Analysis
