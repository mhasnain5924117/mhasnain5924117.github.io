    text: ASME IMECE 2023, New Orleans, LA. Modeling heat and mass transfer in metal hydride-based hydrogen storage systems using the finite volume method.
  - date: 2023-03
    text: 13th U.S. National Combustion Meeting, College Station, TX. 3D mathematical model for heat and mass transfer mechanisms in gypsum board exposed to fire.

