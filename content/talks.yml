  - date: 2026-07
    text: WCCM-ECCOMAS 2026, Munich, Germany. A physics-assisted geometry-generalizable graph convolutional network for fluid flow.
  - date: 2025-11
    text: ASME IMECE 2025, Memphis, TN. Application of graph neural networks for heat transfer and fluid flow problems.
  - date: 2024-03
    text: >-
      ESSCI Spring Technical Meeting, Athens, GA. Three-dimensional modeling of gypsum board calcination
