about:
  - >-
    I am a PhD candidate in the J. Mike Walker '66 Department of Mechanical Engineering at Texas A&M
    University, working with Prof. N. K. Anand in the Computational Heat Transfer Laboratory. My research
    sits at the intersection of scientific machine learning and computational transport phenomena: I build
    graph-based neural surrogates that respect conservation laws, learn from unstructured CFD meshes, and
    generalize across geometries and operating conditions, and I use them to accelerate design and analysis
    of thermal-fluid systems without giving up the reliability of first-principles solvers.
  - >-
    Before Texas A&M, I completed an MS in Mechanical Engineering at Georgia Southern University with
    Dr. Hayri Sezer in the Fire and Energy (FireGY) Laboratory, where I developed finite-volume models of
    coupled heat and mass transfer in metal hydride hydrogen storage reactors and fire-response models of
    gypsum board and tree stems that were validated against experiments and supported a National
    Institute of Justice-funded project. I am a first-generation college graduate, and mentoring
    students who are new to research is a central part of how I work.

