hero_text: >-
  I develop machine learning models that predict fluid flow and heat transfer directly on engineering
  meshes and stay accurate when the geometry or operating conditions change. Paired with validated
  finite-volume solvers, they make design studies, optimization, and safety analysis practical at a
  fraction of the cost of repeated CFD, with applications in energy storage and fire safety.

