hero_text: >-
  I develop physics-consistent scientific machine learning and finite-volume multiphysics models for
  fluid flow, heat transfer, and reactive transport. My recent work includes a residual graph
  convolutional surrogate for thermal-fluid fields (*Physics of Fluids*, 2025), a
  physics-regularized graph surrogate that extrapolates in Reynolds number and to unseen step
  geometries after training on a single geometry (under review, *Physics of Fluids*), a
  multiple-input graph neural operator trained on solver-free manufactured solutions (MIGONet,
  *Transport Phenomena*, 2026), and experimentally validated finite-volume models of fire-exposed
  gypsum board and tree stems and of metal hydride hydrogen storage reactors.

availability: >-
  **Availability:** I expect to complete my PhD in May 2027 and am applying for tenure-track faculty
  positions in computational mechanics, thermal-fluid sciences, and scientific machine learning.

