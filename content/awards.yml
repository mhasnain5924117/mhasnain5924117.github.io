proposals_intro: Proposals I helped conceive and write. Full titles and amounts
  are shown only for awarded projects.
proposals:
  - "**Awarded (2023).** National Institute of Justice, U.S. Department of
    Justice. *Experimental and Numerical Investigations for the Development and
    Validation of Thermo-chemistry Models and Property Databases for Selected
    Wall Lining Materials under Fire Exposure* ($290,289). PI: Hayri Sezer. My
    role: concept development, mathematical modeling, and proposal writing.
    Resulting outputs: [Int. J. Thermal Sciences 221
    (2026)](https://doi.org/10.1016/j.ijthermalsci.2025.110457) and two [NIJ
    library
    records](https://nij.ojp.gov/library/publications/predicting-thermal-respon\
    se-gypsum-board-under-various-heat-flux)."
  - "**Submitted (2026).** U.S. Department of Energy, Consolidated Innovative
    Nuclear Research (CINR). Geometry-generalizable graph neural network
    framework for thermal-hydraulic design optimization. PI: N. K. Anand. My
    role: concept development, methodology formulation, and proposal writing."
  - "**Submitted (2026).** U.S. Department of Energy, CINR. Efficient large eddy
    simulation framework. PI: N. K. Anand. My role: literature review,
    conceptual development, and proposal writing."
  - "**Submitted (2024).** NASA. Multiphysics, multiscale modeling of in-space
    welding and additive manufacturing. PI: Hayri Sezer. My role: proposal draft
    preparation and conceptualization."
